substitutions:
  friendly_name: "Solar Node 01"
  device_name: "solar-node-01"

esphome:
  name: $device_name

esp32:
  board: nodemcu-32s
  toolchain: platformio
  framework:
    type: arduino

wifi:
  networks:
  - ssid: !secret wifi_ssid_1
    password: !secret wifi_password_1
  
  # Lehr
  - ssid: !secret wifi_ssid_4
    password: !secret wifi_password_4

logger:
  level: DEBUG

api:
  encryption:
    key: !secret solar-node-01-key
  reboot_timeout: 24h

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80


esp32_ble_tracker:
  scan_parameters:
    active: false

bluetooth_proxy:
  active: true

sensor:
  - platform: wifi_signal
    name: "$friendly_name WiFi Signal"
    update_interval: 30s

  - platform: internal_temperature
    name: "$friendly_name Internal Temperature"
    update_interval: 60s

  - platform: template
    icon: mdi:memory
    name: Free Memory
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024;
    unit_of_measurement: 'kB'
    state_class: measurement
    entity_category: "diagnostic"
  - platform: uptime
    name: "$friendly_name Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "$friendly_name IP Address"

